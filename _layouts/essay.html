<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fcfbf8">
  {% include seo.html %}
  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
  <link rel="stylesheet" href="{{ '/blog/guidance-in-looped-models/style.css' | relative_url }}">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], tags: 'ams' },
      chtml: { fontURL: '{{ "/blog/guidance-in-looped-models/mathjax/fonts" | relative_url }}', matchFontHeight: false },
      options: { enableMenu: false }
    };
  </script>
  <script defer src="{{ '/blog/guidance-in-looped-models/mathjax/tex-chtml.js' | relative_url }}"></script>
  <script defer src="{{ '/blog/guidance-in-looped-models/app.js' | relative_url }}"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to article</a>
  <header class="site-header">
    <nav aria-label="Site navigation">
      <a href="{{ '/blog/' | relative_url }}">&larr; Blog</a>
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </nav>
  </header>
  <main id="main">
    <article class="essay">
      <header class="article-header">
        <p class="eyebrow">Notes on generative models</p>
        <h1>{{ page.title }}</h1>
        <p class="article-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time><span aria-hidden="true">&middot;</span>{{ page.reading_time | default: '14' }} minute read</p>
      </header>
      {{ content }}
    </article>
  </main>
  <footer class="site-footer">
    <a href="{{ '/blog/' | relative_url }}">&larr; All posts</a>
    <span>&copy; {{ site.time | date: '%Y' }} {{ site.name }}</span>
    <a href="#main">Back to top &uarr;</a>
  </footer>
</body>
</html>
