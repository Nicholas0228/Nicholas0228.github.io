<!doctype html>
<html lang="{{ site.locale | slice: 0, 2 }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{ page.excerpt | strip_html | escape }}">
  {% include seo.html %}
  <link rel="icon" href="assets/icons/layers.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
  {% assign asset_version = site.time | date: '%s' %}
  <link rel="preload" href="assets/fonts/Newsreader.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css?v={{ asset_version }}">
  <link rel="stylesheet" href="site.css?v={{ asset_version }}">
  <script src="motion.js?v={{ asset_version }}" defer></script>
  <script src="app.js?v={{ asset_version }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="personal-header">
    <nav class="wide personal-nav" aria-label="Main navigation">
      <a class="personal-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="personal-links">
        {% for link in site.data.navigation.main %}
        <a href="{{ link.url | relative_url }}"{% if link.title == 'Blog' %} aria-current="true"{% endif %}>{{ link.title }}</a>
        {% endfor %}
      </div>
    </nav>
  </header>
  <nav class="wide project-nav" aria-label="Blog navigation">
    <a class="back-to-blog" href="{{ '/blog/' | relative_url }}"><span aria-hidden="true">&larr;</span> Blog</a>
  </nav>
  {{ content }}
  <footer class="wide project-footer">
    <span>&copy; {{ site.time | date: '%Y' }} {{ site.name }}</span>
    <a href="{{ '/blog/' | relative_url }}">All posts</a>
    <a href="#main">Back to top &uarr;</a>
  </footer>
  <noscript><p class="prose">Read the <a href="paper.pdf">paper PDF</a> for the complete method and results. Interactive diagrams and comparisons require JavaScript.</p></noscript>
  <p id="load-error" role="alert" hidden></p>
</body>
</html>
